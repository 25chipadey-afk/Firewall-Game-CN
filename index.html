<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>FIREWALL DEFENDER — Enterprise Cybersecurity Operations Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ENTERPRISE CYBERSECURITY DESIGN SYSTEM (Classic & Professional SOC)
   Palette: Deep Midnight Slate / Cyan Laser / Emerald Defense / Crimson Threat
   Typography: Plus Jakarta Sans (Headings/UI) + JetBrains Mono (Packets/Data)
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --bg-deep: #050811;
  --bg-surface: #0a101f;
  --bg-card: rgba(12, 20, 36, 0.85);
  --bg-card-hover: rgba(18, 30, 54, 0.92);
  --bg-panel: rgba(8, 14, 26, 0.95);
  
  --cyan: #00f0ff;
  --cyan-glow: 0 0 16px rgba(0, 240, 255, 0.4), 0 0 32px rgba(0, 240, 255, 0.15);
  --cyan-soft: rgba(0, 240, 255, 0.12);
  --cyan-border: rgba(0, 240, 255, 0.3);
  
  --green: #10b981;
  --green-glow: 0 0 16px rgba(16, 185, 129, 0.4), 0 0 32px rgba(16, 185, 129, 0.15);
  --green-soft: rgba(16, 185, 129, 0.12);
  --green-border: rgba(16, 185, 129, 0.35);

  --red: #f43f5e;
  --red-glow: 0 0 16px rgba(244, 63, 94, 0.4), 0 0 32px rgba(244, 63, 94, 0.15);
  --red-soft: rgba(244, 63, 94, 0.12);
  --red-border: rgba(244, 63, 94, 0.4);

  --amber: #f59e0b;
  --amber-glow: 0 0 16px rgba(245, 158, 11, 0.35);
  --amber-soft: rgba(245, 158, 11, 0.12);

  --purple: #a855f7;
  --purple-soft: rgba(168, 85, 247, 0.12);

  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --text-dim: #64748b;

  --border-subtle: rgba(255, 255, 255, 0.08);
  --border-hover: rgba(0, 240, 255, 0.45);

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 20px;

  --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;

  --shadow-hud: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 1px rgba(0, 240, 255, 0.2);
}

html, body {
  height: 100%;
  width: 100%;
  font-family: var(--font-sans);
  background-color: var(--bg-deep);
  color: var(--text-main);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

/* Ambient Cyber Mesh Background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: 
    radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.08) 0%, transparent 60%),
    radial-gradient(circle at 85% 85%, rgba(168, 85, 247, 0.05) 0%, transparent 50%),
    radial-gradient(circle at 15% 90%, rgba(16, 185, 129, 0.05) 0%, transparent 50%),
    linear-gradient(rgba(0, 240, 255, 0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 100% 100%, 36px 36px, 36px 36px;
  pointer-events: none;
  z-index: 0;
}

/* Subtle Vignette Scanline */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at 50% 50%, transparent 65%, rgba(5, 8, 17, 0.85) 100%);
  pointer-events: none;
  z-index: 1;
}

/* ---- Game Root Layout ---- */
#game-root {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  height: 100vh;
  width: 100%;
  max-width: 960px;
  margin: 0 auto;
  overflow: hidden;
  box-shadow: 0 0 80px rgba(0, 0, 0, 0.85);
}

/* ---- Enterprise Top Telemetry Bar ---- */
#top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 18px;
  background: rgba(10, 16, 31, 0.88);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border-subtle);
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
  flex-shrink: 0;
  min-height: 52px;
  gap: 12px;
}
#top-bar.hidden { display: none; }

.tb-section-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.tb-section-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
  min-width: 0;
}
.tb-section-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Shield Integrity Units */
.tb-shields {
  display: flex;
  align-items: center;
  gap: 5px;
  background: rgba(0, 0, 0, 0.35);
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
}
.tb-shield-label {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--text-dim);
  font-weight: 700;
  letter-spacing: 0.5px;
  margin-right: 4px;
}
.shield-unit {
  width: 14px;
  height: 18px;
  background: var(--green);
  border-radius: 3px;
  box-shadow: 0 0 8px var(--green);
  transition: all 0.25s ease;
  position: relative;
  overflow: hidden;
}
.shield-unit::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 40%;
  background: rgba(255, 255, 255, 0.35);
}
.shield-unit.lost {
  background: rgba(255, 255, 255, 0.08);
  box-shadow: none;
  border: 1px dashed rgba(255, 255, 255, 0.2);
}

/* Level Indicator */
.tb-level-badge {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--cyan);
  background: var(--cyan-soft);
  border: 1px solid var(--cyan-border);
  padding: 3px 12px;
  border-radius: 999px;
  letter-spacing: 0.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 280px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.tb-radar-dot {
  width: 6px;
  height: 6px;
  background: var(--cyan);
  border-radius: 50%;
  animation: pulseDot 1.5s infinite;
}
@keyframes pulseDot {
  0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 6px var(--cyan); }
  50% { opacity: 0.4; transform: scale(0.8); box-shadow: none; }
}

/* Score & Combo */
.tb-score-box {
  display: flex;
  align-items: baseline;
  gap: 6px;
  font-family: var(--font-mono);
}
.tb-score-lbl {
  font-size: 0.65rem;
  color: var(--text-dim);
  font-weight: 700;
}
.tb-score-val {
  color: #fbbf24;
  font-weight: 800;
  font-size: 1.05rem;
  letter-spacing: 0.5px;
  text-shadow: 0 0 10px rgba(251, 191, 36, 0.3);
}
.tb-combo-badge {
  background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(168, 85, 247, 0.15));
  border: 1px solid var(--cyan-border);
  color: var(--cyan);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  font-weight: 800;
  padding: 3px 8px;
  border-radius: 4px;
  letter-spacing: 0.5px;
  animation: comboPulse 0.5s ease;
  white-space: nowrap;
}
@keyframes comboPulse {
  0% { transform: scale(0.9); opacity: 0.6; }
  50% { transform: scale(1.1); }
  100% { transform: scale(1); opacity: 1; }
}

/* Top Bar Utility Buttons */
.tb-btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-subtle);
  color: var(--text-muted);
  border-radius: var(--radius-sm);
  padding: 6px 10px;
  cursor: pointer;
  font-size: 0.8rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  transition: all 0.2s ease;
  font-family: var(--font-mono);
}
.tb-btn:hover {
  background: var(--cyan-soft);
  border-color: var(--cyan-border);
  color: var(--cyan);
  box-shadow: var(--cyan-glow);
}

/* ---- Main Container ---- */
#gc {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px 18px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ---- Screens ---- */
.scr {
  width: 100%;
  max-width: 760px;
  animation: fadeUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes fadeUp {
  0% { opacity: 0; transform: translateY(16px); }
  100% { opacity: 1; transform: translateY(0); }
}

/* ---- Professional Cards ---- */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 24px;
  margin-bottom: 16px;
  backdrop-filter: blur(16px);
  box-shadow: var(--shadow-hud);
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.6), transparent);
}
.card h2 {
  font-size: 1.35rem;
  font-weight: 800;
  margin-bottom: 12px;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 10px;
  letter-spacing: -0.3px;
}
.card h3 {
  font-size: 1.05rem;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--cyan);
}
.card p, .card li {
  font-size: 0.92rem;
  line-height: 1.65;
  color: var(--text-secondary);
  margin-bottom: 8px;
}
.card strong {
  color: var(--text-main);
}
.card em {
  color: var(--cyan);
  font-style: normal;
}

/* Avatar Badges */
.char-prof {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 0.8rem;
  font-family: var(--font-mono);
  background: var(--cyan-soft);
  color: var(--cyan);
  border: 1px solid var(--cyan-border);
  margin-right: 6px;
}
.char-glitch {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 0.8rem;
  font-family: var(--font-mono);
  background: var(--red-soft);
  color: var(--red);
  border: 1px solid var(--red-border);
  margin-right: 6px;
}

/* ---- Classic Professional Buttons ---- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 28px;
  border-radius: var(--radius-md);
  font-family: var(--font-sans);
  font-size: 0.92rem;
  font-weight: 700;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
  min-height: 48px;
  touch-action: manipulation;
  border: 1px solid var(--green);
  background: linear-gradient(180deg, rgba(16, 185, 129, 0.25) 0%, rgba(16, 185, 129, 0.08) 100%);
  color: #34d399;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.2);
  text-decoration: none;
}
.btn:hover:not(:disabled) {
  background: linear-gradient(180deg, rgba(16, 185, 129, 0.4) 0%, rgba(16, 185, 129, 0.15) 100%);
  border-color: #34d399;
  color: #ffffff;
  box-shadow: var(--green-glow);
  transform: translateY(-2px);
}
.btn:active:not(:disabled) {
  transform: translateY(0);
}
.btn-cyan {
  border-color: var(--cyan);
  background: linear-gradient(180deg, rgba(0, 240, 255, 0.22) 0%, rgba(0, 240, 255, 0.06) 100%);
  color: var(--cyan);
}
.btn-cyan:hover:not(:disabled) {
  background: linear-gradient(180deg, rgba(0, 240, 255, 0.38) 0%, rgba(0, 240, 255, 0.14) 100%);
  color: #ffffff;
  border-color: #67e8f9;
  box-shadow: var(--cyan-glow);
}
.btn-red {
  border-color: var(--red);
  background: linear-gradient(180deg, rgba(244, 63, 94, 0.22) 0%, rgba(244, 63, 94, 0.06) 100%);
  color: #fb7185;
}
.btn-red:hover:not(:disabled) {
  background: linear-gradient(180deg, rgba(244, 63, 94, 0.38) 0%, rgba(244, 63, 94, 0.14) 100%);
  color: #ffffff;
  border-color: #fda4af;
  box-shadow: var(--red-glow);
}
.btn-gold {
  border-color: #f59e0b;
  background: linear-gradient(180deg, rgba(245, 158, 11, 0.22) 0%, rgba(245, 158, 11, 0.06) 100%);
  color: #fbbf24;
}
.btn-gold:hover:not(:disabled) {
  background: linear-gradient(180deg, rgba(245, 158, 11, 0.38) 0%, rgba(245, 158, 11, 0.14) 100%);
  color: #ffffff;
  border-color: #fde68a;
  box-shadow: var(--amber-glow);
}
.btn-outline {
  border-color: var(--border-subtle);
  background: rgba(255, 255, 255, 0.03);
  color: var(--text-muted);
}
.btn-outline:hover:not(:disabled) {
  border-color: var(--cyan);
  color: var(--cyan);
  background: var(--cyan-soft);
}
.btn-sm {
  padding: 8px 16px;
  font-size: 0.82rem;
  min-height: 38px;
}
.btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: none !important;
}
.btn-grp {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
  margin-top: 18px;
}

/* ---- Title Screen (Executive Cyber Command) ---- */
.title-scr {
  text-align: center;
  padding: 12px 10px 24px;
}
.title-hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 5px 14px;
  background: rgba(0, 240, 255, 0.08);
  border: 1px solid var(--cyan-border);
  border-radius: 999px;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--cyan);
  font-weight: 700;
  letter-spacing: 1px;
  margin-bottom: 12px;
}
.title-logo-wrap {
  position: relative;
  display: inline-block;
  margin-bottom: 8px;
}
.title-shield-icon {
  width: 68px;
  height: 68px;
  filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.5));
  animation: floatShield 4s ease-in-out infinite;
}
@keyframes floatShield {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
.title-main {
  font-size: clamp(2rem, 5vw, 3rem);
  font-weight: 900;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, #ffffff 30%, #67e8f9 70%, #00f0ff 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  line-height: 1.1;
  margin-bottom: 6px;
}
.title-sub {
  font-size: clamp(0.9rem, 2.2vw, 1.15rem);
  color: var(--text-muted);
  font-weight: 500;
  margin-bottom: 16px;
  letter-spacing: 0.3px;
}

.title-cta-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin-bottom: 22px;
}
.title-controls-hint {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--text-dim);
  background: rgba(0, 0, 0, 0.3);
  padding: 4px 12px;
  border-radius: 999px;
  border: 1px solid var(--border-subtle);
}

.mission-dossier {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  max-width: 660px;
  margin: 0 auto 16px;
  text-align: left;
  box-shadow: var(--shadow-hud);
}
.mission-dossier-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-subtle);
  padding-bottom: 8px;
  margin-bottom: 10px;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--text-dim);
}
.mission-dossier-body p {
  font-size: 0.88rem;
  line-height: 1.6;
  color: var(--text-secondary);
  margin-bottom: 8px;
}

/* Feature Grid Chips */
.title-features {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  max-width: 660px;
  margin: 0 auto 12px;
}
.feature-chip {
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 8px 6px;
  text-align: center;
  transition: all 0.2s;
}
.feature-chip:hover {
  border-color: var(--cyan-border);
  background: var(--cyan-soft);
  transform: translateY(-2px);
}
.feature-chip-icon {
  font-size: 1.1rem;
  margin-bottom: 2px;
}
.feature-chip-title {
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--text-main);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.feature-chip-desc {
  font-size: 0.6rem;
  color: var(--text-dim);
  font-family: var(--font-mono);
  white-space: nowrap;
}

/* ---- Level Arena (SOC Tactical Radar Grid) ---- */
.arena-wrapper {
  width: 100%;
  position: relative;
  display: flex;
  flex-direction: column;
}

.arena {
  position: relative;
  width: 100%;
  height: 460px;
  border: 1px solid var(--cyan-border);
  border-radius: var(--radius-lg);
  background: linear-gradient(180deg, rgba(6, 11, 22, 0.96) 0%, rgba(9, 17, 34, 0.98) 100%);
  overflow: hidden;
  touch-action: none;
  box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.7), 0 12px 32px rgba(0, 0, 0, 0.5);
}

/* Arena Grid Backdrop */
.arena::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: 
    linear-gradient(rgba(0, 240, 255, 0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 240, 255, 0.035) 1px, transparent 1px);
  background-size: 30px 30px;
  pointer-events: none;
  z-index: 1;
}

/* Arena Zones */
.zone-tag {
  position: absolute;
  left: 12px;
  font-family: var(--font-mono);
  font-size: 0.62rem;
  letter-spacing: 1.5px;
  font-weight: 700;
  color: var(--text-dim);
  pointer-events: none;
  z-index: 2;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 6px;
}
.zone-tag-top { top: 8px; }
.zone-tag-bottom { bottom: 10px; }

/* The Glowing Firewall Laser Line */
.fw-line {
  position: absolute;
  bottom: 50px;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--green) 20%, #6ee7b7 50%, var(--green) 80%, transparent);
  box-shadow: 0 0 16px var(--green), 0 0 32px rgba(16, 185, 129, 0.5);
  z-index: 5;
  pointer-events: none;
}
.fw-line::after {
  content: '';
  position: absolute;
  top: -6px;
  bottom: -6px;
  left: 0;
  right: 0;
  background: repeating-linear-gradient(90deg, rgba(16, 185, 129, 0.15) 0px, rgba(16, 185, 129, 0.15) 8px, transparent 8px, transparent 16px);
  animation: laserScan 2s linear infinite;
}
@keyframes laserScan {
  0% { transform: translateX(0); }
  100% { transform: translateX(32px); }
}

.fw-badge {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--green);
  letter-spacing: 2px;
  font-weight: 800;
  background: rgba(16, 185, 129, 0.1);
  border: 1px solid var(--green-border);
  padding: 3px 12px;
  border-radius: 999px;
  z-index: 5;
  pointer-events: none;
  box-shadow: 0 0 12px rgba(16, 185, 129, 0.2);
}

/* ---- Classic Data Packets (High-Tech Inspection Frame) ---- */
.pkt {
  position: absolute;
  width: 120px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  background: rgba(13, 22, 42, 0.94);
  backdrop-filter: blur(8px);
  cursor: pointer;
  z-index: 4;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
  transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
  touch-action: manipulation;
  overflow: hidden;
}
.pkt:hover {
  border-color: var(--cyan);
  box-shadow: 0 8px 24px rgba(0, 240, 255, 0.35);
  transform: scale(1.04);
}
.pkt-top-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 3px 6px;
  background: rgba(0, 0, 0, 0.35);
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  font-family: var(--font-mono);
  font-size: 0.58rem;
}
.pkt-proto-pill {
  font-weight: 800;
  padding: 1px 4px;

/* Resolution States */
.pkt.blocked-good {
  border-color: var(--green) !important;
  background: rgba(16, 185, 129, 0.35) !important;

}
.pkt.blocked-bad {
  border-color: var(--amber) !important;
  background: rgba(245, 158, 11, 0.35) !important;

}
.pkt.leaked {
  border-color: var(--red) !important;
  background: rgba(244, 63, 94, 0.35) !important;

}

@keyframes pktIntercept {

  100% { transform: scale(0.7); opacity: 0; }

const SFX = (()=>{
  let ctx = null, muted = false;
  function getCtx() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function playTone(freq, dur, type='sine', gain=0.12, endFreq=null) {
    if (muted) return;
    try {
      const c = getCtx();
      const osc = c.createOscillator();
      const g = c.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, c.currentTime);
      if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, c.currentTime + dur);
      g.gain.setValueAtTime(gain, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
      osc.connect(g);
      g.connect(c.destination);
      osc.start();
      osc.stop(c.currentTime + dur);
    } catch(e) {}
  }
  return {
    block() {
      // High-tech laser deflect
      playTone(600, 0.06, 'triangle', 0.15, 950);
      setTimeout(() => playTone(950, 0.09, 'sine', 0.12), 40);

    leak() {

      setTimeout(() => playTone(140, 0.28, 'sawtooth', 0.14, 70), 90);

}

/* ═══════════════════════════════════════════════════════════════
   SECTION 7: GAME PHYSICS & PACKET EVALUATION
   ═══════════════════════════════════════════════════════════════ */

function gameLoop(now) {
  if (!S.gameRunning) return;
  if (S.paused) {
    S.animFrame = requestAnimationFrame(gameLoop);
    return;
  }

  const dt = (now - S.lastFrame) / 1000;
  S.lastFrame = now;
  S.levelElapsed = (now - S.levelStartTime) / 1000;
  S.levelTimeLeft = Math.max(0, S.levelDuration - S.levelElapsed);

  // Update timer bar
  const tf = $('timer-fill');
  if (tf) tf.style.width = `${(S.levelTimeLeft / S.levelDuration) * 100}%`;

  const lv = LEVEL_CFG[S.level];

  // Fall velocity calculation
  let speed = lv.speed;
  if (S.level === 4) {
    speed = lv.speed + S.levelElapsed * 1.5;
    if (S.rateLimitActive && now < S.rateLimitEnd) {
      speed *= 0.4;
    } else if (S.rateLimitActive && now >= S.rateLimitEnd) {
      S.rateLimitActive = false;
    }
  }

  // Boss bar update
  if (S.level === 4) {
    const bf = $('boss-fill');
    const bt = $('boss-hp-txt');
    if (bf) bf.style.width = `${(S.bossHp / S.bossMaxHp) * 100}%`;
    if (bt) bt.textContent = `ATTACK POWER: ${Math.max(0, Math.round(S.bossHp))}%`;

    const prBtn = $('pu-rate');
    const psBtn = $('pu-subnet');
    if (prBtn) {
      prBtn.classList.toggle('active', S.rateLimitActive);
      prBtn.disabled = S.rateLimitActive || now < S.rateLimitCoolEnd;
    }
    if (psBtn) {
      psBtn.classList.toggle('active', !!S.blockSubnet);
      psBtn.disabled = !!S.blockSubnet || now < S.blockSubnetCoolEnd;
    }
    if (S.blockSubnet && now >= S.blockSubnetEnd) S.blockSubnet = null;
    if (S.bossHp <= 0) { endLevel(); return; }
  }

  // Move in-flight packets
  for (let i = S.packets.length - 1; i >= 0; i--) {
    const p = S.packets[i];
    if (p.resolved) continue;
    p.y += speed * dt;
    if (p.el) p.el.style.top = `${p.y}px`;

    // Reached firewall line?
    if (p.y >= S.fwLineY) {
      if (lv.mode === 'auto') {
        autoFilter(p);
      } else {
        if (p.malicious) {
          threatLeaked(p);
        } else {
          correctAllow(p);
        }
      }
    }
  }

  S.packets = S.packets.filter(p => !p.removed);
  S.animFrame = requestAnimationFrame(gameLoop);
}

function spawnPacket() {
  if (!S.gameRunning || S.paused) return;
  const rect = S.arenaEl.getBoundingClientRect();
  S.arenaW = rect.width;
  const pktW = 120;
  const x = Math.random() * (S.arenaW - pktW - 24) + 12;
  let yStart = -75;

  if (S.level === 2) yStart = -75 + 34;
  if (S.level === 3) yStart = -75 + 85;
  if (S.level === 4) yStart = -75 + 45;

  const pkt = generatePacket(x, yStart);
  S.packets.push(pkt);
  S.totalPkts++;

  // Create High-Tech Packet DOM element
  const el = document.createElement('div');
  el.className = 'pkt';
  el.dataset.id = pkt.id;

  const protoClass = pkt.proto === 'TCP' ? 'pkt-proto-tcp' : 'pkt-proto-udp';
  let flagHtml = '';
  if (pkt.flags) {
    const flagClass = pkt.flags === 'SYN' ? 'pkt-flag-syn' : 'pkt-flag-ack';
    flagHtml = `<span class="pkt-flags-pill ${flagClass}">${pkt.flags}</span>`;
  }

  el.innerHTML = `
    <div class="pkt-top-row">
      <span class="pkt-proto-pill ${protoClass}">${pkt.proto}</span>
      ${flagHtml}
    </div>
    <div class="pkt-center">
      <div class="pkt-port-num">:${pkt.dstPort}</div>
      <div class="pkt-svc-name">${esc(pkt.service)}</div>
    </div>
    <div class="pkt-bottom-row">${esc(pkt.srcIp)}</div>
  `;

  el.style.left = `${x}px`;
  el.style.top = `${pkt.y}px`;
  pkt.el = el;

  // Level 5: Subnet powerup auto-block
  if (S.level === 4 && S.blockSubnet && pkt.srcIp.startsWith(S.blockSubnet)) {
    pkt.resolved = true;
    if (pkt.malicious) {
      S.blocked++; S.score += 20; S.bossHp = Math.max(0, S.bossHp - 1);
      el.classList.add('blocked-good');
    } else {
      S.falseBlocks++; S.score = Math.max(0, S.score - 20);
      el.classList.add('blocked-bad');
    }
    updateTopBar();
    setTimeout(() => { el.remove(); pkt.removed = true; }, 380);
    S.arenaEl.appendChild(el);
    return;
  }

  S.arenaEl.appendChild(el);
}

function generatePacket(x, y) {
  const id = S.nextId++;
  switch (S.level) {
    case 0: return genL1(id, x, y);
    case 1: return genL2(id, x, y);
    case 2: return genL3(id, x, y);
    case 3: return genL4(id, x, y);
    case 4: return genL5(id, x, y);
    default: return genL1(id, x, y);
  }
}

function genL1(id, x, y) {
  const mal = Math.random() < LEVEL_CFG[0].malRatio;
  const port = mal ? pick(DANGER_PORTS) : pick(SAFE_PORTS);
  const p = PORTS[port];
  return { id, x, y, dstPort: port, service: p.name, proto: Math.random() > 0.3 ? 'TCP' : 'UDP', srcIp: mal ? randIp() : pick(LEGIT_IPS), malicious: mal, reason: p.reason, resolved: false, removed: false, el: null };
}

function genL2(id, x, y) {
  const mal = Math.random() < LEVEL_CFG[1].malRatio;
  const port = mal ? pick(DANGER_PORTS) : pick(SAFE_PORTS);
  const p = PORTS[port];
  return { id, x, y, dstPort: port, service: p.name, proto: Math.random() > 0.3 ? 'TCP' : 'UDP', srcIp: randIp(), malicious: mal, reason: p.reason, resolved: false, removed: false, el: null };
}

function genL3(id, x, y) {
  const r = Math.random();
  let srcIp, port, mal, reason;
  if (r < 0.3) {
    srcIp = pick(LEGIT_IPS); port = pick(SAFE_PORTS); mal = false; reason = PORTS[port].reason;
  } else if (r < 0.48) {
    srcIp = pick(THREAT_IPS); port = pick(SAFE_PORTS); mal = true; reason = 'Blacklisted Threat IP! Must be blocked regardless of destination port.';
  } else if (r < 0.72) {
    srcIp = pick(THREAT_IPS); port = pick(DANGER_PORTS); mal = true; reason = `Blacklisted Threat IP on exploit port ${port} (${PORTS[port].name}) — critical drop!`;
  } else if (r < 0.85) {
    srcIp = randIp(); port = pick(SAFE_PORTS); mal = false; reason = `Unknown public IP on safe port ${port} (${PORTS[port].name}) — allowed.`;
  } else {
    srcIp = randIp(); port = pick(DANGER_PORTS); mal = true; reason = PORTS[port].reason;
  }
  return { id, x, y, dstPort: port, service: PORTS[port].name, proto: Math.random() > 0.3 ? 'TCP' : 'UDP', srcIp, malicious: mal, reason, resolved: false, removed: false, el: null };
}

function genL4(id, x, y) {
  const isResponse = Math.random() < 0.42;
  if (isResponse) {
    const conn = pick(CONNECTIONS);
    return { id, x, y, dstPort: conn.srcPort, service: conn.svc + ' reply', proto: 'TCP', srcIp: conn.dstIp, flags: 'ACK', malicious: false, reason: `Verified response to established session (${conn.srcIp}:${conn.srcPort} ➔ ${conn.dstIp}:${conn.dstPort}).`, resolved: false, removed: false, el: null };
  } else {
    const port = pick([80, 443, 22, 3389, 445, 8080]);
    const srcIp = Math.random() < 0.4 ? pick(THREAT_IPS) : randIp();
    return { id, x, y, dstPort: port, service: PORTS[port] ? PORTS[port].name : 'Unknown', proto: 'TCP', srcIp, flags: 'SYN', malicious: true, reason: 'Unsolicited inbound [SYN] packet — no matching session in SPI table. Dropped!', resolved: false, removed: false, el: null };
  }
}

function genL5(id, x, y) {
  const mal = Math.random() < LEVEL_CFG[4].malRatio;
  let srcIp, port;
  if (mal) {
    const subnet = pick(BOT_SUBNETS);
    srcIp = `${subnet.prefix}.${randInt(1, 254)}`;
    port = pick([...SAFE_PORTS, ...DANGER_PORTS]);
  } else {
    srcIp = pick(LEGIT_IPS);
    port = pick(SAFE_PORTS);
  }
  const p = PORTS[port] || { name: 'PROBE', reason: '' };
  return { id, x, y, dstPort: port, service: p.name, proto: Math.random() > 0.3 ? 'TCP' : 'UDP', srcIp, malicious: mal, reason: mal ? `DDoS bot flood packet from ${srcIp}` : p.reason, resolved: false, removed: false, el: null };
}

/* ---- Packet Interception Actions ---- */
function manualBlock(id) {
  const p = S.packets.find(pk => pk.id === id);
  if (!p || p.resolved) return;
  p.resolved = true;
  if (p.malicious) {
    correctBlock(p);
  } else {
    overBlock(p);
  }
}

function correctBlock(p) {
  S.blocked++;
  const mult = comboMult();
  const pts = 40 * mult;
  S.score += pts;
  S.combo++;
  if (S.combo > S.maxCombo) S.maxCombo = S.combo;
  SFX.block();
  p.el.classList.add('blocked-good');
  floatMsg(p, `+${pts} PTS // INTERCEPT`, 'good');
  if (S.level === 4) { S.bossHp = Math.max(0, S.bossHp - 1.2); }
  updateTopBar();
  setTimeout(() => { p.el.remove(); p.removed = true; }, 380);
}

function overBlock(p) {
  S.falseBlocks++;
  S.score = Math.max(0, S.score - 20);
  S.combo = 0;
  SFX.overblock();
  p.el.classList.add('blocked-bad');
  floatMsg(p, `−20 PTS // FALSE POSITIVE`, 'warn');
  showMistakeReason('⚠ FALSE POSITIVE (OVER-BLOCKED)', `Port ${p.dstPort} (${p.service}) is verified legitimate traffic.`);
  updateTopBar();
  setTimeout(() => { p.el.remove(); p.removed = true; }, 420);
}

function threatLeaked(p) {
  S.leaked++;
  S.hearts--;
  S.combo = 0;
  SFX.leak();
  p.el.classList.add('leaked');
  floatMsg(p, `−1 SHIELD // PERIMETER BREACH`, 'bad');
  showMistakeReason('❌ PERIMETER SECURITY BREACH', p.reason);
  updateTopBar();
  if (S.arenaEl) S.arenaEl.classList.add('screen-shake');
  setTimeout(() => { if (S.arenaEl) S.arenaEl.classList.remove('screen-shake'); }, 350);
  setTimeout(() => { p.el.remove(); p.removed = true; }, 550);
  if (S.hearts <= 0) {
    setTimeout(() => { cleanup(); S.screen = 'gameover'; render(); }, 650);
  }
}

function correctAllow(p) {
  S.correctAllows++;
  S.score += 10;
  S.combo++;
  if (S.combo > S.maxCombo) S.maxCombo = S.combo;
  p.resolved = true;
  p.el.classList.add('passed-safe');
  updateTopBar();
  setTimeout(() => { p.el.remove(); p.removed = true; }, 260);
}

/* ---- Level 2: Auto Filter by Rules ---- */
function autoFilter(p) {
  p.resolved = true;
  let matched = null;
  for (let i = 0; i < S.userRules.length; i++) {
    const r = S.userRules[i];
    const portMatch = r.port === '*' || +r.port === p.dstPort;
    const protoMatch = r.proto === 'ANY' || r.proto === p.proto;
    if (portMatch && protoMatch) {
      matched = { action: r.action, num: i + 1 };
      break;
    }
  }
  if (!matched) matched = { action: S.defaultAction, num: 'DEFAULT' };

  const ruleTag = `RULE #${matched.num}: ${matched.action.toUpperCase()}`;

  if (matched.action === 'block') {
    if (p.malicious) {
      S.blocked++; S.score += 40; S.combo++;
      if (S.combo > S.maxCombo) S.maxCombo = S.combo;
      SFX.block();
      p.el.classList.add('auto-blocked');
      floatMsg(p, `+40 [${ruleTag}]`, 'good');
    } else {
      S.falseBlocks++; S.score = Math.max(0, S.score - 20); S.combo = 0;
      SFX.overblock();
      p.el.classList.add('blocked-bad');
      floatMsg(p, `−20 [${ruleTag}]`, 'warn');
    }
  } else {
    if (p.malicious) {
      S.leaked++; S.hearts--; S.combo = 0;
      SFX.leak();
      p.el.classList.add('auto-leaked');
      floatMsg(p, `−1 SHIELD [${ruleTag}]`, 'bad');
      if (S.hearts <= 0) {
        setTimeout(() => { cleanup(); S.screen = 'gameover'; render(); }, 650);
        return;
      }
    } else {
      S.correctAllows++; S.score += 10; S.combo++;
      if (S.combo > S.maxCombo) S.maxCombo = S.combo;
      p.el.classList.add('passed-safe');
    }
  }
  updateTopBar();
  setTimeout(() => { p.el.remove(); p.removed = true; }, 450);
}

function floatMsg(p, text, cls) {
  const fb = document.createElement('div');
  fb.className = `fb-float ${cls}`;
  fb.textContent = text;
  fb.style.left = `${Math.min(S.arenaW - 140, Math.max(10, p.x))}px`;
  fb.style.top = `${p.y - 10}px`;
  if (S.arenaEl) S.arenaEl.appendChild(fb);
  setTimeout(() => fb.remove(), 1800);
}

function showMistakeReason(title, reason) {
  document.querySelectorAll('.mistake-reason').forEach(e => e.remove());
  const el = document.createElement('div');
  el.className = 'mistake-reason';
  el.innerHTML = `<strong>${title}</strong> — ${reason}`;
  if (S.arenaEl) S.arenaEl.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

/* ---- Level 5 Power-Ups ---- */
function activateRateLimit() {
  if (S.rateLimitActive || performance.now() < S.rateLimitCoolEnd) return;
  SFX.powerup();
  S.rateLimitActive = true;
  S.rateLimitEnd = performance.now() + 5000;
  S.rateLimitCoolEnd = performance.now() + 20000;
}

function showSubnetPicker() {
  if (S.blockSubnet || performance.now() < S.blockSubnetCoolEnd) return;
  const picker = document.createElement('div');
  picker.className = 'subnet-picker';
  picker.innerHTML = `
    <h4>Select CIDR Subnet to Blackhole:</h4>
    ${BOT_SUBNETS.map(s => `
      <button class="subnet-opt" data-prefix="${s.prefix}">
        <span>${s.prefix}.0/24</span>
        <span style="color:var(--text-dim);font-size:0.7rem;">${s.name}</span>
      </button>`).join('')}
    <button class="subnet-opt" style="border-color:var(--text-dim);color:var(--text-muted);justify-content:center;">Cancel</button>`;

  picker.querySelectorAll('.subnet-opt').forEach(btn => {
    btn.onclick = () => {
      const prefix = btn.dataset.prefix;
      picker.remove();
      if (prefix) {
        SFX.powerup();
        S.blockSubnet = prefix;
        S.blockSubnetEnd = performance.now() + 10000;
        S.blockSubnetCoolEnd = performance.now() + 25000;
      }
    };
  });
  S.arenaEl.appendChild(picker);
}

/* ---- SDN Bonus Quiz ---- */
function rSdnQuiz() {
  let qIdx = 0;
  function drawQ() {
    if (qIdx >= SDN_QUIZ.length) {
      SFX.win();
      S.screen = 'win';
      render();
      return;
    }
    const q = SDN_QUIZ[qIdx];
    const letters = ['A', 'B', 'C', 'D'];
    const shuffledIdx = shuffle(q.opts.map((_, i) => i));
    const correctShuffled = shuffledIdx.indexOf(q.correct);

    gc.innerHTML = `
    <div class="scr">
      <div class="card">
        <div class="quiz-q-num">SDN ARCHITECTURE CERTIFICATION // QUESTION 0${qIdx + 1} OF 0${SDN_QUIZ.length}</div>
        <div class="quiz-q">${q.q}</div>
        <div class="quiz-opts" id="quiz-opts">
          ${shuffledIdx.map((origI, i) => `
            <button class="quiz-opt" data-i="${i}">
              <span class="quiz-opt-letter">${letters[i]}</span>
              <span>${esc(q.opts[origI])}</span>
            </button>`).join('')}
        </div>
        <div id="exp-area"></div>
      </div>
    </div>`;

    document.querySelectorAll('.quiz-opt').forEach(btn => {
      btn.onclick = () => {
        const idx = +btn.dataset.i;
        const correct = idx === correctShuffled;
        document.querySelectorAll('.quiz-opt').forEach((b, j) => {
          b.classList.add('dim');
          if (j === correctShuffled) b.classList.add('correct');
          if (j === idx && !correct) b.classList.add('wrong');
        });

        if (correct) {
          SFX.correct();
          S.score += 100;
        } else {
          SFX.wrong();
        }
        updateTopBar();

        const cls = correct ? 'good' : 'bad';
        const ttl = correct ? '✅ VERIFIED ACCURATE' : '❌ INCORRECT ASSESSMENT';
        $('exp-area').innerHTML = `
          <div class="exp-panel ${cls}">
            <div class="exp-title">${ttl}</div>
            <div>${q.exp}</div>
            <div class="btn-grp" style="margin-top:14px;justify-content:flex-end;">
              <button class="btn btn-sm btn-cyan" id="next-q">PROCEED →</button>
            </div>
          </div>`;
        $('next-q').onclick = () => {
          SFX.click();
          qIdx++;
          drawQ();
        };
      };
    });
  }
  drawQ();
}

/* ═══════════════════════════════════════════════════════════════
   SECTION 9: GLOBAL EVENT LISTENERS & HOTKEYS
   ═══════════════════════════════════════════════════════════════ */

$('mute-btn').onclick = () => {
  const m = SFX.toggle();
  $('mute-btn').textContent = m ? '🔇' : '🔊';
};

$('pause-btn').onclick = () => {
  if (S.screen !== 'playing') return;
  S.paused = !S.paused;
  if (!S.paused) S.lastFrame = performance.now();
  updateTopBar();
};

window.addEventListener('keydown', e => {
  if (e.code === 'Space' && S.screen === 'playing') {
    e.preventDefault();
    S.paused = !S.paused;
    if (!S.paused) S.lastFrame = performance.now();
    updateTopBar();
  }
  if (e.key === '1' && S.screen === 'playing' && S.level === 4) {
    activateRateLimit();
  }
  if (e.key === '2' && S.screen === 'playing' && S.level === 4) {
    showSubnetPicker();
  }
  if (e.key.toLowerCase() === 'm') {
    const m = SFX.toggle();
    $('mute-btn').textContent = m ? '🔇' : '🔊';
  }
  if (e.key.toLowerCase() === 'l' && S.screen === 'playing') {
    showLearnOverlay();
  }
});

document.addEventListener('contextmenu', e => e.preventDefault());

// Initialize
render();
</script>
